name: Verify archived results

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute scores and token statistics
        run: python3 scripts/verify_results.py
      - name: Check script syntax
        run: python3 -m compileall -q scripts
